  (function () {
    var ua = navigator.userAgent;
    var m = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|Opera Mini|IEMobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (m) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1');
  })();
</script>
